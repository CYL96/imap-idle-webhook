[package]
name = "imap-idle-webhook"
version = "0.1.0"
edition = "2021"
description = "IMAP IDLE listener that forwards new email events to a signed webhook"

[lib]
name = "imap_idle_webhook"
path = "src/lib.rs"

[[bin]]
name = "imap-idle-webhook"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
env_logger = "0.11"
hex = "0.4"
hmac = "0.13"
log = "0.4"
mailparse = "0.16.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
temp-env = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
